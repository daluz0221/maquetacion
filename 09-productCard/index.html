<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>ProductCard</title>
</head>
<body>
    <div class="container">
        <span class="estampa">NIKE</span>
        <div class="circle__blue"></div>
        <figure class="img__product">
            <img src="./assets/shoes2.png" alt="">
        </figure>
        <h2 class="title__shoes">Nike Shoes</h2>
        <div class="product__content">
            <div class="size__content">
                <h4 class="size__title">Size:</h4>
                <ul class="size__list">
                    <li class="size__item">7</li>
                    <li class="size__item">8</li>
                    <li class="size__item">9</li>
                    <li class="size__item">10</li>
                </ul>
            </div>
            <div class="color__content">
                <h4>Color:</h4>
                <ul class="color__list">
                    <li class="color__item1"></li>
                    <li class="color__item2"></li>
                    <li class="color__item3"></li>
                </ul>
            </div>
            <button class="button__content">
                Buy Now
            </button>
        </div>
    </div>
</body>
</html>
