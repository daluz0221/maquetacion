<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>NetfixCone</title>
</head>
<body>
    <nav class="navbar">
        <figure class="logo__img">
            <img src="./assets/Netflix_2015_logo.svg.png" alt="">
        </figure>
        <ul class="nav__links">
            <li class="nav__item">Home</li>
            <li class="nav__item">Tv shows</li>
            <li class="nav__item">Movies</li>
            <li class="nav__item">Latest</li>
            <li class="nav__item">My List</li>
        </ul>
        <div class="search__bar">
            <input type="text" class="search__input" value="Search">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </nav>
</body>
</html>
