<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>CristalEffect</title>
</head>
<body>
   <div class="container">
    <h2>Personajes populares</h2>
    <ul class="pj__list">
        <li class="pj__item">
            <figure class="img__contet">
                <img src="./assets/homero.webp" alt="Homero">
            </figure>
            <div class="pj__info">
                <h6>Homero</h6>
                <p>Esposo de marge</p>
            </div>
            <span class="ranking__position">#1</span>
        </li>
        <li class="pj__item">
            <figure class="img__contet">
                <img src="./assets/marge.webp" alt="Marge">
            </figure>
            <div class="pj__info">
                <h6>Marge</h6>
                <p>Esposa de homero</p>
            </div>
            <span class="ranking__position">#2</span>
        </li>
        <li class="pj__item">
            <figure class="img__contet">
                <img src="./assets/bart.jpg" alt="Bart">
            </figure>
            <div class="pj__info">
                <h6>Bart</h6>
                <p>Hijo</p>
            </div>
            <span class="ranking__position">#3</span>
        </li>
        <li class="pj__item">
            <figure class="img__contet">
                <img src="./assets/lisa.jpg" alt="Lisa">
            </figure>
            <div class="pj__info">
                <h6>Lisa</h6>
                <p>Hija</p>
            </div>
            <span class="ranking__position">#4</span>
        </li>
        <li class="pj__item">
            <figure class="img__contet">
                <img src="./assets/magie.jpg" alt="Magie">
            </figure>
            <div class="pj__info">
                <h6>Magie</h6>
                <p>Hija</p>
            </div>
            <span class="ranking__position">#5</span>
        </li>
    </ul>
   </div>
</body>
</html>
