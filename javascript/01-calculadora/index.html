<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel='stylesheet' href='./styles.css'>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css'
    integrity='sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==' crossorigin='anonymous'
    referrerpolicy='no-referrer' />
    <title>Calculadora</title>
</head>
<body>
    <div class="container">
        <div class="circle"></div>
        <div class="numbers" id="numbers">0</div>
        <ul class="calculator__grid">
            <li class="item item1">C</li>
            <li class="item item2 itemAction">/</li>
            <li class="item item3 itemAction">*</li>
            <li class="item item4 itemAction">&lt;</li>
            <li class="item item5 itemNumber">7</li>
            <li class="item item6 itemNumber">8</li>
            <li class="item item7 itemNumber">9</li>
            <li class="item item8 itemAction">-</li>
            <li class="item item9 itemNumber">4</li>
            <li class="item item15 itemNumber">5</li>
            <li class="item item10 itemNumber">6</li>
            <li class="item item11 itemAction">+</li>
            <li class="item item12 itemNumber">1</li>
            <li class="item item13 itemNumber">2</li>
            <li class="item item14 itemNumber">3</li>
            <li class="item item16 itemNumber itemAction">.</li>
            <li class="item item17 itemNumber">0</li>
            <li class="item item18 itemNumber itemAction">00</li>
            <li class="item item19">=</li>
        </ul>
    </div>
    <script src="./main.js"></script>
</body>
</html>
