<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>KFC</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="./assets/KFC-logo.png" alt="logo" class="img__logo">
        </div>
        <nav class="navbar">
            <ul class="nav__list">
                <li class="nav__item">Home</li>
                <li class="nav__item">Menu</li>
                <li class="nav__item">About</li>
                <li class="nav__item">Contact</li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="info__text">
            <p class="title">Its Finger</p>
            <p class="title">Lickin <span>Good.</span> </p>
            <p class="info__content">Lorem ipsum dolor sit amet consectetur adipisicing elit. Et eum unde ipsam ad provident cupiditate odit, enim pariatur cumque, neque nostrum possimus asperiores velit. Nam porro sint obcaecati praesentium maxime.</p>
            <button>
                Order Now
            </button>
            <ul class="social__list">
                <li class="social__item"><i class="fa-brands fa-facebook"></i></li>
                <li class="social__item"><i class="fa-brands fa-instagram"></i></li>
                <li class="social__item"><i class="fa-brands fa-twitter"></i></li>
            </ul>
        </div>
        <div class="info__img">
            <img src="./assets/kfc-img.png" alt="">
        </div>
    </main>
</body>
</html>
